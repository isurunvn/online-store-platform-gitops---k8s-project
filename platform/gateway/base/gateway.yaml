apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: online-store-gateway
  namespace: platform
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - identity
                  - online-store
