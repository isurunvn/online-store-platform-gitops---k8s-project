apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-discovery
  namespace: identity
spec:
  parentRefs:
    - kind: Gateway
      name: online-store-gateway
      namespace: platform
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /realms/online-store/.well-known/openid-configuration
      backendRefs:
        - name: keycloak
          port: 8080
