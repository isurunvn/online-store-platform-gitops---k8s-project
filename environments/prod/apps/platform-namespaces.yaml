apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-namespaces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/isurunvn/online-store-platform-gitops---k8s-project.git
    targetRevision: main
    path: clusters/oke-prod/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
